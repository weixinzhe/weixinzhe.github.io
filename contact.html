<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系 · 我的小站</title>
  <meta name="description" content="联系方式。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">🌱 我的小站</a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">作品</a>
        <a href="contact.html">联系</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>联系我</h1>
    <p class="lead">把下面的邮箱和链接换成你自己的。</p>

    <h2>邮箱</h2>
    <p>
      <code id="mail">your-name@example.com</code>
      <!-- data-copy 是自定义属性，js/main.js 会读取它并实现点击复制 -->
      <button class="btn" type="button" data-copy="your-name@example.com">复制邮箱</button>
    </p>

    <h2>其他</h2>
    <p>
      GitHub：<a href="https://github.com/" target="_blank" rel="noopener">github.com/你的用户名</a><br>
      Bilibili / 知乎 / 博客：按需补充。
    </p>

    <h2>关于这个页面</h2>
    <p>
      「复制邮箱」按钮是纯 JavaScript 实现的，代码在 <code>js/main.js</code> 里。
      所有页面都共用一个 JS 文件，所以你在任何页面加 <code>data-copy="要复制的文字"</code> 都能获得这个效果。
    </p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-year></span> 我的小站 · 由 GitHub Pages 免费托管</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
