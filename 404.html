<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 404 页面可能被显示在任意子路径下（比如 /abc/def），
       加上 <base href="/"> 才能让 css/style.css 这类相对路径正确找到。
       注意：这行只在「用户主页站」(用户名.github.io) 上有效。 -->
  <base href="/">
  <title>404 · 页面走丢了</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">🌱 我的小站</a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">作品</a>
        <a href="contact.html">联系</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>404 · 这个页面不存在 🧭</h1>
    <p class="lead">你访问的地址没有对应的页面，可能是链接打错了，或者页面被删掉了。</p>
    <a class="btn" href="index.html">回到首页</a>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-year></span> 我的小站 · 由 GitHub Pages 免费托管</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
